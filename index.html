(function(){
'use strict';


const BG_DEFAULT = { enabled: true, speed: 1, color: '#A855F7', cell: 45 };
function bgSettings(){
  try {
    const s = JSON.parse(localStorage.getItem('egt_bg_settings') || '{}');
    return Object.assign({}, BG_DEFAULT, s);
  } catch(e){ return Object.assign({}, BG_DEFAULT); }
}
function hexToRgb(hex){
  const m = /^#?([0-9a-f]{6})$/i.exec(String(hex).trim());
  if(!m) return { r: 168, g: 85, b: 247 };
  const n = parseInt(m[1], 16);
  return { r: (n >> 16) & 255, g: (n >> 8) & 255, b: n & 255 };
}

const canvas = document.createElement('canvas');

  ROWS = Math.max(1, Math.ceil(H / (SIZE * dpr())));

  const cfg = bgSettings();
  setCell(Math.max(20, Math.min(80, Number(cfg.cell) || BG_DEFAULT.cell)));

  resizeTimer = setTimeout(resizeNow, 130);

  const pg = (location.pathname.split('/').pop() || '').toLowerCase();

    mode = JSON.parse(localStorage.getItem('egt_menu_bg') || '"gradient-waves"');
  } else {

  };

  var pet = document.getElementById('pet');
  var hint = document.getElementById('hint');
  var pressed = false;
  var bounceTimer = null;
  var hintHidden = false;
  var audioCtx = null;
  var players = [];
  var playerIdx = 0;

  var EASE_PRESS = 'cubic-bezier(0.33, 1, 0.68, 1)';
  var EASE_OVER = 'cubic-bezier(0.33, 1, 0.68, 1)';
  var EASE_BACK = 'cubic-bezier(0.65, 0, 0.35, 1)';

  function initAudio() {
    if (players.length) return;
    try {
      var keys = ['pat', 'pat1', 'pat2'];
      for (var i = 0; i < keys.length; i++) {
        var a = new Audio(AUDIO_DATA[keys[i]]);
        a.preload = 'auto';
        a.volume = 0.78;
        players.push(a);
      }
    } catch (e) {}
  }

  function playPat() {
    if (players.length) {
      try {
        playerIdx = (playerIdx + 1) % players.length;
        var a = players[playerIdx];
        a.currentTime = 0;
        var pr = a.play();
        if (pr && pr.catch) pr.catch(function () {});
        return;
      } catch (e) {}
    }
    playFallback();
  }

  function playFallback() {
    try {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      if (!audioCtx) audioCtx = new AC();
      if (audioCtx.state === 'suspended') audioCtx.resume();

      var ctx = audioCtx;
      var now = ctx.currentTime;
      var master = ctx.createGain();
      master.gain.setValueAtTime(0.0001, now);
      master.gain.exponentialRampToValueAtTime(0.30, now + 0.012);
      master.gain.exponentialRampToValueAtTime(0.0001, now + 0.22);
      master.connect(ctx.destination);

      var o1 = ctx.createOscillator();
      var g1 = ctx.createGain();
      o1.type = 'sine';
      o1.frequency.setValueAtTime(760, now);
      o1.frequency.exponentialRampToValueAtTime(300, now + 0.13);
      g1.gain.setValueAtTime(1, now);
      o1.connect(g1); g1.connect(master);
      o1.start(now); o1.stop(now + 0.24);

      var o2 = ctx.createOscillator();
      var g2 = ctx.createGain();
      o2.type = 'triangle';
      o2.frequency.setValueAtTime(1180, now + 0.008);
      o2.frequency.exponentialRampToValueAtTime(520, now + 0.11);
      g2.gain.setValueAtTime(0.42, now);
      g2.gain.exponentialRampToValueAtTime(0.001, now + 0.12);
      o2.connect(g2); g2.connect(master);
      o2.start(now + 0.008); o2.stop(now + 0.14);
    } catch (e) {}
  }

  function hideHint() {
    if (hintHidden) return;
    hintHidden = true;
    hint.classList.add('fade');
  }

  function squash() {
    if (pressed) return;
    pressed = true;
    if (bounceTimer) { clearTimeout(bounceTimer); bounceTimer = null; }
    pet.classList.add('pressed');
    pet.style.transition = 'transform 55ms ' + EASE_PRESS + ', opacity 55ms linear';
    pet.style.transform = 'scale(1.30, 0.50)';
    pet.style.opacity = '0.92';
    initAudio();
    playPat();
    hideHint();
  }

  function bounce() {
    if (!pressed) return;
    pressed = false;
    pet.classList.remove('pressed');
    pet.style.transition = 'transform 150ms ' + EASE_OVER + ', opacity 120ms linear';
    pet.style.transform = 'scale(0.95, 1.07)';
    pet.style.opacity = '1';
    bounceTimer = setTimeout(function () {
      pet.style.transition = 'transform 300ms ' + EASE_BACK;
      pet.style.transform = 'scale(1, 1)';
      bounceTimer = null;
    }, 150);
  }

  pet.addEventListener('pointerdown', function (e) {
    e.preventDefault();
    try { pet.setPointerCapture(e.pointerId); } catch (err) {}
    squash();
  });
  pet.addEventListener('pointerup', function (e) { e.preventDefault(); bounce(); });
  pet.addEventListener('pointercancel', function () { bounce(); });
  pet.addEventListener('lostpointercapture', function () { if (pressed) bounce(); });
  pet.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  pet.addEventListener('dragstart', function (e) { e.preventDefault(); });
  document.addEventListener('gesturestart', function (e) { e.preventDefault(); });
  document.addEventListener('dblclick', function (e) { e.preventDefault(); });

  initAudio();
})();
</script>
